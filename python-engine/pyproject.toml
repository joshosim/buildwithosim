[project]
name = "stem-engine"
version = "1.0.0"
description = "FastAPI service that separates music into stems with Demucs"
requires-python = ">=3.10"

[project.optional-dependencies]
reader-tts = ["chatterbox-tts>=0.1.5", "torchaudio>=2.1,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
anyio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]
ignore = ["S101"]  # assert is fine, and is used for invariants

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B017"]
